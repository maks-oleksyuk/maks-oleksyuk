name: 👨🏼‍💻 Readme

on:
  push:

  # Run automatically every week
  schedule:
    - cron: '0 20 * * 6'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  cleanup:
    name: 🧹 Clean up GitHub repo
    runs-on: ubuntu-latest
    permissions:
      actions: write

    steps:
      - name: 🗑 Delete workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: 0
          keep_minimum_runs: 0

  readme:
    name: 🖼️ Generate images
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 🐍 Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake/light.svg
            dist/snake/dark.svg?palette=github-dark

      - name: 🏆 Generate achievements (mobile)
        id: mobile
        uses: gh-metrics/metrics@master
        timeout-minutes: 10
        with:
          base: ''
          token: ${{ secrets.TOKEN }}
          filename: achievements.mobile.svg
          output_action: none
          extras_css: |
            .items-wrapper {padding-top: 40px;}
            section>.field {display: none;}
            .achievement {
              align-items: center;
              padding-inline: 18%;
            }
          plugin_achievements: yes

      - name: 🏆 Generate achievements (tablet)
        if: steps.mobile.outcome == 'success'
        uses: gh-metrics/metrics@master
        timeout-minutes: 10
        with:
          base: ''
          token: ${{ secrets.TOKEN }}
          filename: achievements.tablet.svg
          output_action: none
          extras_css: |
            .items-wrapper {padding-top: 20px;}
            section>.field {display: none;}
            .achievement {align-items: center;}
            svg.large .achievements.detailed {
              display: grid;
              grid-template-columns: repeat(auto-fit, minmax(480px, 1fr));
            }
            svg.large .largeable-width-half {
              width: 70%;
              padding-inline: 15%;
            }
          config_display: large
          plugin_achievements: yes

      - name: 🏆 Generate achievements (desktop)
        if: steps.mobile.outcome == 'success'
        uses: gh-metrics/metrics@master
        timeout-minutes: 10
        with:
          base: ''
          token: ${{ secrets.TOKEN }}
          filename: achievements.desktop.svg
          output_action: none
          extras_css: |
            .items-wrapper {padding-top: 15px;}
            section>.field {display: none;}
            .achievement {align-items: center;}
            svg.large .achievements.detailed {
              display: grid;
              grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            }
            svg.large .largeable-width-half {
              width: 90%;
              padding-inline: 5%;
            }
          config_display: large
          plugin_achievements: yes

      - name: ➡️ Move files
        if: always()
        run: |
          mkdir -p ./dist/metrics/ ./dist/stats/
          sudo mv /metrics_renders/* ./dist/metrics/

      - name: 📤 Push to output branch
        if: always()
        uses: crazy-max/ghaction-github-pages@v5
        with:
          build_dir: dist
          target_branch: output
          commit_message: 'Update generated images'
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
